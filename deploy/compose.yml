services:
  backend:
    build:
      context: ../backend-salah-main
    restart: unless-stopped
    environment:
      APP_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET es obligatorio}
      COOKIE_SECURE: "true"
      TRUSTED_PROXY_CIDRS: 172.30.10.0/24
      DB_HOST: ${DB_HOST:?DB_HOST es obligatorio}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?DB_USER es obligatorio}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatorio}
      DB_NAME: ${DB_NAME:?DB_NAME es obligatorio}
      DB_SSLMODE: ${DB_SSLMODE:-verify-full}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    volumes:
      - uploads:/app/internal/images
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - private

  frontend:
    build:
      context: ../front-salah-main
    restart: unless-stopped
    environment:
      NUXT_BACKEND_URL: http://backend:5000
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - private

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN es obligatorio}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    networks:
      - private

networks:
  private:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  uploads:
  caddy_data:
  caddy_config:
